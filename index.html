    <!-- Polyfill to eliminate Chromium Permissions Policy violations for deprecated unload events -->
    <script>
      (function() {

            var originalAddEventListener = EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener = function(type, listener, options) {

                return originalAddEventListener.call(this, 'pagehide', listener, options);
              }
              return originalAddEventListener.call(this, type, listener, options);
            };
          }
          try {
            Object.defineProperty(window, 'onunload', {
              get: function() { return null; },
              set: function(fn) {
                if (typeof fn === 'function') {
                  window.addEventListener('pagehide', fn);
                }
              },
              configurable: true,
            });
          } catch (_) {}

          try {
            var origCreateElement = Document.prototype.createElement;
            Document.prototype.createElement = function(tagName, options) {
              var el = origCreateElement.call(this, tagName, options);
              if (tagName && typeof tagName === 'string' && tagName.toLowerCase() === 'iframe') {
                el.setAttribute('allow', 'unload');
              }
              return el;
            };
          } catch (_) {}
        }
      })();
